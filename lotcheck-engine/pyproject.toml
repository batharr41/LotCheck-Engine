[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "lotcheck-engine"
version = "0.1.0"
description = "Ingest, normalize and profile FDA medical device adverse event reports (openFDA / MAUDE)."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
  "httpx>=0.27",
  "ijson>=3.3",
  "pyarrow>=15",
  "duckdb>=1.0",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
lotcheck = "lotcheck.cli:main"

[tool.setuptools.packages.find]
include = ["lotcheck*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
